# Compila, prueba y publica en el App Service con cada push a la rama test.
# Necesita en el Environment "test" de GitHub:
#   secret   AZUREAPPSERVICE_PUBLISHPROFILE  (perfil de publicacion del App Service)
#   variable AZURE_WEBAPP_NAME               (nombre del App Service)
# Si el Deployment Center de Azure genero su propio workflow, se puede usar ese en vez de este.
name: Build and deploy ms-gastos-plan

on:
  push:
    branches: [test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y probar
        run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/app.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: app.jar
