spring.application.name=ms-gastos-plan
# Archivo local opcional con secretos para correr en tu computadora (NO se sube a GitHub).
# En Azure no existe y se usan las variables de entorno del App Service.
spring.config.import=optional:file:./local.properties
server.port=${PORT:8080}

# --- Base de datos ---
# Sin variables de entorno usa H2 en memoria (para correr local sin Azure).
# En Azure: SQL_URL, SQL_USER y SQL_PASSWORD apuntan a Azure SQL.
spring.datasource.url=${SQL_URL:jdbc:h2:mem:gastosplan;MODE=MSSQLServer;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SQL_USER:sa}
spring.datasource.password=${SQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# Campos desconocidos en el body -> 400 (igual que ms-perfil-precios)
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Cola de Azure Storage (eventos PRESUPUESTO_80 / PRESUPUESTO_100) ---
# Sin STORAGE_CONNECTION_STRING el evento solo se escribe en el log.
app.queue.connection-string=${STORAGE_CONNECTION_STRING:}
app.queue.name=${QUEUE_NAME:eventos-presupuesto}
app.queue.base64=${QUEUE_BASE64:false}

# --- Certificado cliente (Lab 5) ---
# En Azure: CLIENT_CERT_REQUIRED=true y CLIENT_CERT_THUMBPRINT=<huella SHA-1 sin ':'>
app.security.client-cert.required=${CLIENT_CERT_REQUIRED:false}
app.security.client-cert.thumbprint=${CLIENT_CERT_THUMBPRINT:}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger

# --- Logs en JSON (incluyen correlationId) ---
logging.structured.format.console=ecs
